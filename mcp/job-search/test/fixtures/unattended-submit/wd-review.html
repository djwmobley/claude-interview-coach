<!doctype html>
<html><head><meta charset="utf-8"><title>Workday review fixture</title></head>
<body>
<div data-automation-id="applyFlowPage">
  <h2>Review</h2>
  <div><span>City</span> <span>Houston</span></div>
  <div><span>Phone Number</span> <span>(713) 555-0100</span></div>
  <div data-automation-id="file-upload-item"><span data-automation-id="file-upload-item-name">resume.docx</span></div>
</div>
<div data-automation-id="pageFooter">
  <button type="button" data-automation-id="saveForLater">Save and Continue Later</button>
  <button type="button" data-automation-id="pageFooterNextButton">Submit</button>
</div>
<script>
  window.__clicks = [];
  for (const b of document.querySelectorAll('button')) b.addEventListener('click', function () {
    window.__clicks.push(b.getAttribute('data-automation-id'));
    if (b.getAttribute('data-automation-id') !== 'pageFooterNextButton') return;
    setTimeout(function () {
      document.body.textContent = '';
      var h = document.createElement('h2');
      h.textContent = 'Thank you for applying';
      document.body.appendChild(h);
    }, 50);
  });
</script>
</body></html>
