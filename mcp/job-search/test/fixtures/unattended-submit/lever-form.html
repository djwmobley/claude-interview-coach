<!doctype html>
<html><head><meta charset="utf-8"><title>Lever form fixture</title></head>
<body>
<form class="application-form" onsubmit="return false;">
  <label for="name-input">Full name *</label><input id="name-input" name="name" required>
  <label for="email-input">Email *</label><input id="email-input" name="email" required>
  <label for="phone-input">Phone</label><input id="phone-input" name="phone">
  <label for="resume-upload-input">Resume *</label><input id="resume-upload-input" type="file" name="resume" required>
  <button data-qa="btn-submit-application" type="submit">Submit application</button>
</form>
<script>
  window.__clicks = 0;
  document.querySelector('[data-qa="btn-submit-application"]').addEventListener('click', function () {
    window.__clicks += 1;
    setTimeout(function () {
      history.pushState({}, '', '/acme/1234/thanks');
      document.body.textContent = '';
      var p = document.createElement('p');
      p.textContent = 'Done.';
      document.body.appendChild(p);
    }, 50);
  });
</script>
</body></html>
