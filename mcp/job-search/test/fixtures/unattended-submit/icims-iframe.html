<!doctype html>
<html><head><meta charset="utf-8"><title>iCIMS iframe confirmation fixture</title></head>
<body>
<div class="iCIMS_MainWrapper">
  <form onsubmit="return false;">
    <label for="firstName">First name *</label><input id="firstName" name="firstName" required>
    <label for="lastName">Last name *</label><input id="lastName" name="lastName" required>
    <label for="email">Email *</label><input id="email" name="email" required>
    <label for="resume">Resume *</label><input id="resume" type="file" name="resume" required>
    <button id="icims_submit_button" type="submit">Submit</button>
  </form>
</div>
<script>
  window.__clicks = 0;
  document.getElementById('icims_submit_button').addEventListener('click', function () {
    window.__clicks += 1;
    var f = document.createElement('iframe');
    f.setAttribute('srcdoc', '<h1>Thank you for applying</h1>');
    document.body.appendChild(f);
  });
</script>
</body></html>
